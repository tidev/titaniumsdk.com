name: CI

# Nothing ran on a pull request or on main before this — only the CLA check.
# That is how `main` came to hold a registry manifest naming four blobs that
# were never committed: every check that would have caught it existed, and none
# of them ran anywhere except on a developer's machine.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm check

      - name: Tests
        run: pnpm test

      # A clean checkout is the point. `validate-registry` resolves every blob a
      # manifest names, so on a tree where a commit left one behind it fails
      # here even though it passed on the machine that wrote it.
      - name: Registry
        run: pnpm check:registry

      - name: Contrast
        run: pnpm check:contrast

      # Guide content: frontmatter, partials, and every internal link resolving
      # against the IA. The build runs this too, but failing here names the page
      # and the problem instead of surfacing as a render error.
      - name: Docs
        run: pnpm check:docs

      # The build reads the whole registry and renders from it, so it is also
      # the broadest check that the compiled corpus is intact.
      - name: Build
        run: pnpm build
