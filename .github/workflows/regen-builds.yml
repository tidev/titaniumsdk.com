name: 'Regen Builds'

# Uses the vendored generator in scripts/, not tidev/titanium-builds-regen-action.
# The action hardcodes `<branch>.expired.json` and reads it back as its own
# cache, so owning the layout meant owning the generator. downloads-www still
# uses the published action, untouched, until the cutover in TI-51.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [regen-builds]

concurrency:
  group: regen-builds
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate releases and builds
        run: node scripts/generate-builds.ts
        env:
          # Reads public releases and workflow runs from tidev/titanium-sdk.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate against the schemas
        run: node scripts/validate-registry.ts

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Regen SDK releases and builds'
