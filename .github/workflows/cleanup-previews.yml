name: Cleanup previews

# Vercel's retention policy does not reclaim a merged branch's previews for 30
# days, and even then it keeps the last 20 non-production deployments whatever
# their age. That floor is how the free tier's 10 GB of Deployment Storage
# filled: 114 previews across 30 merged branches, not one of them reachable from
# anything. Removing them by hand is not subject to either the wait or the
# floor, so this does it the moment the pull request stops being active.
#
# "Active" is Vercel's own word: a branch stops protecting its latest preview
# once its pull request is merged or closed. This fires on both.
#
# `pull_request_target` rather than `pull_request` so that pull requests from
# forks are cleaned up too. Under `pull_request` they are handed no secrets, so
# this had to skip them, and they leaked: a third of the merged pull requests
# here come from forks, and the five previews left orphaned after the last
# manual sweep were every one of them a fork's. `_target` is safe in this
# workflow specifically because it never checks out the pull request's code --
# it reads two numbers off the event and shells out to Vercel. Do not add a
# checkout step without revisiting that.
on:
  pull_request_target:
    types: [closed]

# Two runs for one pull request would race on the same deployments, and whichever
# lost would fail on URLs the winner had already removed.
concurrency:
  group: cleanup-previews-${{ github.event.pull_request.number }}

# `pull_request_target` would otherwise hand a fork's pull request a writable
# GITHUB_TOKEN. Nothing here talks to the GitHub API.
permissions: {}

jobs:
  remove:
    runs-on: ubuntu-latest

    env:
      # Identifiers, not credentials. They name the project that VERCEL_TOKEN
      # already grants access to, and both change if it is recreated or moved.
      VERCEL_ORG_ID: team_av3JbwDsQiwntXs2XWbz7JhJ
      VERCEL_PROJECT_ID: prj_Emee30vHKLvUjwbyZu4gVAuVaQsC
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The pull request number, which Vercel records on every deployment it
      # builds as `githubPrId`. Matching on that rather than on the branch name
      # is what makes a fork safe to clean up: fork branches are named by their
      # author, so `githubCommitRef=main` or `=patch-1` can name a deployment
      # belonging to some other pull request entirely, or to this repo's own
      # main. A pull request number collides with nothing.
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Remove this pull request's preview deployments
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is unset. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

          # `list` returns at most 100 per call, so ask again until a call comes
          # back empty. The bound is what stops a removal that silently does
          # nothing from spinning here forever; reaching it is a real failure.
          for _ in $(seq 1 10); do
            urls=$(npx --yes vercel@59 list \
              --token "$VERCEL_TOKEN" \
              --environment preview \
              --meta githubPrId="$PR_NUMBER" \
              --limit 100 --json | jq -r '.deployments[].url')

            if [ -z "$urls" ]; then
              echo "No preview deployments remain for PR #$PR_NUMBER."
              exit 0
            fi

            echo "$urls" | xargs npx --yes vercel@59 remove --yes --token "$VERCEL_TOKEN"
          done

          echo "PR #$PR_NUMBER still has previews after 10 passes; removal is not taking effect."
          exit 1
