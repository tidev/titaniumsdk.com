name: 'Regen API Docs'

# Replaces titanium-docs/.github/workflows/regen.yml, which checked out all 17
# source repos at fetch-depth: 0 on every dispatch regardless of what changed.
# This fetches only the repo named in the payload, shallow, apidoc/ only.
on:
  repository_dispatch:
    types: [regen-api-docs]
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repo, e.g. tidev/ti.map'
        required: true
        default: tidev/titanium-sdk
      ref:
        description: 'Branch or tag to compile'
        required: false
        default: ''
      version:
        description: 'Registry version to write. `main` is the only mutable one.'
        required: false
        default: main
      sdk:
        description: 'Compiled SDK a module resolves its Titanium.* references against'
        required: false
        default: main

# One regen at a time per source. Two dispatches for the same repo would race on
# the same output paths and on the commit; different repos write to different
# paths and can safely overlap.
concurrency:
  group: regen-api-docs-${{ github.event.client_payload.repo || inputs.repo }}
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      SOURCE_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
      SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref }}
      TARGET_VERSION: ${{ github.event.client_payload.version || inputs.version || 'main' }}
      # Which compiled SDK a module's references into Titanium.* resolve against.
      # Only modules use it, and the compile refuses to guess: a module's links
      # point at one particular SDK's pages, so the caller says which.
      SDK_VERSION: ${{ github.event.client_payload.sdk || inputs.sdk || 'main' }}

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before any clone. The dispatch payload comes from outside, so an
      # unlisted repo has to be refused rather than fetched.
      - name: Check the source is on the allowlist
        id: source
        run: node scripts/docgen/check-source.ts "$SOURCE_REPO"

      - name: Checkout the source repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          # Only what the compile reads, and only the tip. The old workflow took
          # full history of every repo; apidoc/ plus the manifests is all this
          # needs, and the manifests are how a module's id is resolved.
          sparse-checkout: |
            apidoc
            android/manifest
            ios/manifest
            iphone/manifest
            manifest
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Compile
        id: regen
        env:
          SOURCE_KIND: ${{ steps.source.outputs.kind }}
        run: |
          args=(--repo "$SOURCE_REPO" --checkout source --version "$TARGET_VERSION")
          # The SDK is the corpus the modules resolve into, so it takes no --sdk
          # of its own; regen.ts refuses either flag in the wrong place rather
          # than compiling something whose links were never checked.
          if [ "$SOURCE_KIND" = module ]; then
            args+=(--sdk "$SDK_VERSION")
          fi
          node scripts/docgen/regen.ts "${args[@]}"

      - name: Validate against the schemas
        run: node scripts/validate-registry.ts

      - name: Summary
        run: echo "${{ steps.regen.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"

      # Only when the compile actually changed bytes. docgen holds generatedAt
      # steady on an unchanged run, so there is no timestamp-only diff to commit.
      - name: Commit
        id: commit
        if: steps.regen.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Regen API docs for ${{ env.SOURCE_REPO }}@${{ env.TARGET_VERSION }}'
          # Two paths: the version directory and the shared pool beside it.
          # The manifest in the first names blobs that live in the second, so
          # committing only the version directory publishes dangling
          # references — see the note in regen.ts.
          file_pattern: ${{ steps.regen.outputs.paths }}

      # The commit is selective, so it can silently publish less than the regen
      # produced. That is not hypothetical: `file_pattern` was scoped to the
      # version directory, TI-25 moved the content into the shared pool beside
      # it, and a regen committed a manifest whose four new blobs stayed in the
      # runner. `validate-registry` above cannot see that — it runs before the
      # commit, when everything still resolves on disk.
      #
      # Anything left in the working tree after the commit is something the
      # pattern did not cover.
      - name: Nothing left behind
        if: steps.regen.outputs.changed == 'true'
        run: |
          left=$(git status --porcelain -- registry/)
          if [ -n "$left" ]; then
            echo "::error::the commit did not include everything the regen wrote:"
            echo "$left"
            echo 'Widen the `paths` output in scripts/docgen/regen.ts to cover it.' >&2
            exit 1
          fi
          echo "Every file the regen wrote was committed." >> "$GITHUB_STEP_SUMMARY"

      - name: Report no-op
        if: steps.regen.outputs.changed != 'true'
        run: echo "No content change — nothing committed." >> "$GITHUB_STEP_SUMMARY"
